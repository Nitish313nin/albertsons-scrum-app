<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Albertsons Shared Scrum</title><script src="/socket.io/socket.io.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font:14px system-ui}header{position:sticky;top:0;z-index:5;color:#fff;background:linear-gradient(135deg,#172554,#2563eb);padding:14px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.brand{font-weight:800;font-size:17px}.sub{font-size:11px;opacity:.8}nav{display:flex;gap:6px;overflow:auto;margin-top:10px}nav button{white-space:nowrap;border:0;border-radius:9px;padding:8px;background:#ffffff22;color:#fff;font-weight:700}main{max-width:1100px;margin:auto;padding:14px}.page{display:none}.page.active{display:block}.card{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card b.big{font-size:25px;display:block}button{border:0;border-radius:9px;padding:9px 12px;background:#2563eb;color:#fff;font-weight:700;margin:2px}button.gray{background:#e5e7eb;color:#374151}button.red{background:#dc2626}button.green{background:#16a34a}input,select,textarea{width:100%;padding:10px;border:1px solid #d5ddea;border-radius:9px;margin:4px 0 10px;font:inherit}label{font-size:12px;font-weight:800}.badge{padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800;background:#e5e7eb}.done{background:#dcfce7;color:#15803d}.prog{background:#dbeafe;color:#1d4ed8}.test{background:#ffedd5;color:#c2410c}.active{background:#cffafe;color:#0e7490}.empty{padding:28px;text-align:center;border:1px dashed #b9c5d6;border-radius:12px;color:#687386}.item{border:1px solid #e2e8f0;border-radius:11px;padding:10px;margin:7px 0}.tree{margin-left:14px;padding-left:10px;border-left:2px solid #dbe4f0}.board{display:grid;grid-template-columns:repeat(4,270px);gap:10px;overflow:auto}.col{background:#e9eef5;border-radius:12px;padding:9px;min-height:270px}.task{background:#fff;padding:10px;border-radius:10px;margin:7px 0;border-left:4px solid #2563eb}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#172554,#2563eb);padding:18px}.loginbox{background:#fff;padding:24px;border-radius:20px;width:min(430px,100%)}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:min(700px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;margin:auto}.timeline{border-left:3px solid #bfdbfe;padding-left:14px}.event{margin:0 0 12px}.comment{border:1px solid #e2e8f0;border-radius:10px;padding:9px;margin:7px 0}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><h1>🛒 Albertsons Retail Data Modernization</h1><p class="sub">Shared central project</p><label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password"><button style="width:100%" onclick="login()">Login</button><button class="gray" style="width:100%;margin-top:6px" onclick="setupOwner()">Set / Reset Owner Password</button><p id="msg" style="color:#64748b;font-size:12px">Enter your owner password. If this is the first setup, use “Set / Reset Owner Password” once.</p></div></div>
<div id="app" style="display:none"><header><div class="top"><div><div class="brand">🛒 Albertsons Retail Data Modernization</div><div class="sub">Shared • Central DB • Realtime</div></div><button class="gray" onclick="logout()">Logout</button></div><nav id="nav"></nav></header><main>
<section id="home" class="page active"></section><section id="backlog" class="page"></section><section id="sprints" class="page"></section><section id="board" class="page"></section><section id="mywork" class="page"></section><section id="team" class="page"></section><section id="scrum" class="page"></section><section id="meetings" class="page"></section><section id="audit" class="page"></section></main></div><div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<script>
let S,ME;const socket=io();socket.on("changed",()=>ME&&load());
const $=id=>document.getElementById(id),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c])),owner=()=>ME.role==="Owner"&&ME.email.toLowerCase()==="nitishkumar.nin@gmail.com";
async function api(u,o={}){let r=await fetch(u,{headers:{"Content-Type":"application/json"},...o});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
async function login(){try{ME=(await api("/api/login",{method:"POST",body:JSON.stringify({email:em.value,password:pw.value})})).user;$("login").style.display="none";$("app").style.display="block";load()}catch(e){msg.textContent=e.message}}
async function setupOwner(){try{if(em.value.trim().toLowerCase()!=="nitishkumar.nin@gmail.com"){msg.textContent="Owner email must be nitishkumar.nin@gmail.com";return}if(!pw.value||pw.value.length<8){msg.textContent="Enter an owner password of at least 8 characters";return}ME=(await api("/api/owner/setup",{method:"POST",body:JSON.stringify({email:em.value,password:pw.value})})).user;$("login").style.display="none";$("app").style.display="block";load()}catch(e){msg.textContent=e.message}}
async function logout(){await api("/api/logout",{method:"POST"});location.reload()}
async function load(){S=await api("/api/state");render()}
function go(x){document.querySelectorAll(".page").forEach(e=>e.classList.remove("active"));$(x).classList.add("active");render()}
function badge(x){let c=x==="Done"?"done":x==="In Progress"?"prog":x==="Testing"?"test":x==="Active"?"active":"";return `<span class="badge ${c}">${esc(x)}</span>`}
function uname(id){return S.users.find(x=>x.id==id)?.name||"Unassigned"}function sname(id){return S.sprints.find(x=>x.id==id)?.name||"Backlog"}
function nav(){let a=[["home","🏠 Home"],["backlog","📚 Backlog"],["sprints","🗓️ Sprints"],["board","📋 Board"],["mywork","👤 My Work"],["team","👥 Team"],["scrum","🔄 Scrum"],["meetings","📅 Meetings"],["audit","🕘 Audit"]];$("nav").innerHTML=a.map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join("")}
function render(){nav();home();backlog();sprints();board();mywork();team();scrum();meetings();audit()}
function home(){$("home").innerHTML=`<h1>Project Overview</h1><div class="card"><h2>🛒 ${esc(S.project.name)}</h2><p>All phones/users use the same central database.</p><b>Logged in:</b> ${esc(ME.name)} • ${esc(ME.email)} • ${esc(ME.role)}</div><div class="grid"><div class="card">Epics<b class="big">${S.epics.length}</b></div><div class="card">Features<b class="big">${S.features.length}</b></div><div class="card">Tasks<b class="big">${S.tasks.length}</b></div><div class="card">Sprints<b class="big">${S.sprints.length}</b></div></div>${owner()?`<div class="card"><button onclick="modal('epic')">+ Epic</button><button onclick="modal('feature')">+ Feature</button><button onclick="modal('pbi')">+ PBI</button><button onclick="modal('task')">+ Task</button><button onclick="modal('sprint')">+ Sprint</button><button onclick="modal('user')">+ User</button></div>`:""}${!S.epics.length&&!S.tasks.length&&!S.sprints.length?`<div class="empty"><b>Project is clean</b><p>Create work items only when required.</p></div>`:""}`}
function backlog(){let h="<h1>Backlog</h1>";if(owner())h+=`<button onclick="modal('epic')">+ Epic</button> <button onclick="modal('feature')">+ Feature</button> <button onclick="modal('pbi')">+ PBI</button> <button onclick="modal('task')">+ Task</button>`;if(!S.epics.length)h+=`<div class="card">${empty("No Epics")}</div>`;S.epics.forEach(e=>{h+=`<div class="card"><b>🟣 ${esc(e.title)}</b>${owner()?` <button class="red" onclick="del('epics',${e.id})">Delete</button>`:""}`;S.features.filter(f=>f.epic_id==e.id).forEach(f=>{h+=`<div class="tree item"><b>🔵 ${esc(f.title)}</b>${owner()?` <button class="red" onclick="del('features',${f.id})">Delete</button>`:""}`;S.pbis.filter(p=>p.feature_id==f.id).forEach(p=>{h+=`<div class="tree item"><b>🔷 ${esc(p.title)}</b> ${badge(p.priority)}`;S.tasks.filter(t=>t.pbi_id==p.id).forEach(t=>h+=`<div class="tree item"><b>🟢 ${esc(t.title)}</b> ${badge(t.status)}<div class="small">Assigned: ${esc(uname(t.assignee_id))}</div><button onclick="task(${t.id})">Open</button></div>`);h+="</div>"});h+="</div>"});h+="</div>"});$("backlog").innerHTML=h}
function sprints(){let h="<h1>Sprints</h1>"+(owner()?`<button onclick="modal('sprint')">+ Sprint</button>`:"");if(!S.sprints.length)h+=empty("No Sprints");S.sprints.forEach(s=>h+=`<div class="card"><b>${esc(s.name)}</b> ${badge(s.state)}<p>${esc(s.start_date)} → ${esc(s.end_date)}</p>${owner()?`<button onclick="post('/api/sprints/${s.id}/start')">Start</button><button onclick="post('/api/sprints/${s.id}/close')">Close</button><button class="red" onclick="del('sprints',${s.id})">Delete</button>`:""}</div>`);$("sprints").innerHTML=h}
function board(){let s=S.sprints.find(x=>x.state==="Active");if(!s){$("board").innerHTML="<h1>Sprint Board</h1>"+empty("No Active Sprint");return}let st=["To Do","In Progress","Testing","Done"],h=`<h1>${esc(s.name)} Board</h1><div class="board">`;st.forEach(x=>{h+=`<div class="col"><h3>${x}</h3>`;S.tasks.filter(t=>t.sprint_id==s.id&&t.status===x).forEach(t=>h+=`<div class="task"><b>${esc(t.title)}</b><div class="small">${esc(uname(t.assignee_id))}</div>${owner()||t.assignee_id==ME.id?`<select onchange="status(${t.id},this.value)">${st.map(v=>`<option ${v===t.status?"selected":""}>${v}</option>`).join("")}</select>`:""}<button onclick="task(${t.id})">Details</button></div>`);h+="</div>"});h+="</div>";$("board").innerHTML=h}
function mywork(){let ts=owner()?S.tasks:S.tasks.filter(t=>t.assignee_id==ME.id);$("mywork").innerHTML="<h1>My Work</h1>"+(ts.length?ts.map(t=>`<div class="card"><b>${esc(t.title)}</b> ${badge(t.status)}<p class="small">Assigned: ${esc(uname(t.assignee_id))} • ${esc(sname(t.sprint_id))}</p>${owner()||t.assignee_id==ME.id?`<select onchange="status(${t.id},this.value)">${["To Do","In Progress","Testing","Done"].map(x=>`<option ${x===t.status?"selected":""}>${x}</option>`).join("")}</select>`:""}<button onclick="task(${t.id})">Open</button></div>`).join(""):empty("No Tasks"))}
function team(){let h="<h1>Team</h1>"+(owner()?`<button onclick="modal('user')">+ User</button>`:"");h+=`<div class="grid2"><div class="card"><b>👑 Nitish Kumar</b><p>${OWNER}</p><span class="badge active">Owner / Full Access</span></div>`;S.users.filter(u=>u.email.toLowerCase()!=OWNER).forEach(u=>h+=`<div class="card"><b>👤 ${esc(u.name)}</b><p>${esc(u.email)}</p><p>${esc(u.role)}</p>${owner()?`<button class="red" onclick="del('users',${u.id})">Delete</button>`:""}</div>`);$("team").innerHTML=h+"</div>"}
function scrum(){$("scrum").innerHTML=`<h1>Scrum</h1><div class="grid2">${["Daily Scrum","Sprint Planning","Sprint Review","Retrospective"].map(x=>`<div class="card"><h2>${x}</h2><p>Real meeting can be scheduled with attendee emails and Teams/Meet link.</p>${owner()?`<button onclick="modal('meeting','${x}')">Schedule</button>`:""}</div>`).join("")}</div>`}
function meetings(){let h="<h1>Meetings</h1>"+(owner()?`<button onclick="modal('meeting','Daily Scrum')">+ Meeting</button>`:"");S.meetings.forEach(m=>h+=`<div class="card"><b>📅 ${esc(m.title)}</b><p>${esc(m.meeting_date)} • ${esc(m.meeting_time)} • ${m.duration} min</p><p class="small">${esc(m.attendees||"")}</p>${m.link?`<button class="green" onclick="location.href='${esc(m.link)}'">Join</button>`:""}</div>`);$("meetings").innerHTML=h+(S.meetings.length?"":empty("No Meetings"))}
function audit(){let h=`<h1>Activity / Audit</h1><div class="card">${owner()?`<button class="red" onclick="delAuditAll()">Clear All</button>`:""}<div class="timeline">`;S.audit.forEach(a=>h+=`<div class="event"><div class="between"><div><b>${esc(a.action)}</b><div class="small">${esc(a.created_at)} • ${esc(a.actor_email||"")}</div></div>${owner()?`<button class="red" onclick="delAudit(${a.id})">Delete</button>`:""}</div></div>`);$("audit").innerHTML=h+"</div></div>"}
function empty(x){return `<div class="empty">${x}</div>`}
async function post(u){try{await api(u,{method:"POST",body:"{}"});load()}catch(e){alert(e.message)}}
async function del(t,id){if(!confirm("Delete?"))return;try{await api("/api/"+t+"/"+id,{method:"DELETE"});load()}catch(e){alert(e.message)}}
async function status(id,v){try{await api("/api/tasks/"+id+"/status",{method:"PATCH",body:JSON.stringify({status:v})});load()}catch(e){alert(e.message)}}
async function delAudit(id){if(confirm("Delete audit record?"))del("audit",id)}async function delAuditAll(){if(confirm("Clear all audit records?")){await api("/api/audit",{method:"DELETE"});load()}}
function task(id){let t=S.tasks.find(x=>x.id==id),cs=S.comments.filter(x=>x.task_id==id);$("sheet").innerHTML=`<h2>${esc(t.title)}</h2><p>${esc(t.description||"")}</p><p><b>Acceptance:</b> ${esc(t.acceptance_criteria||"")}</p><p>${badge(t.status)} • ${esc(uname(t.assignee_id))}</p>${owner()||t.assignee_id==ME.id?`<select id="ts">${["To Do","In Progress","Testing","Done"].map(x=>`<option ${x===t.status?"selected":""}>${x}</option>`).join("")}</select><button onclick="status(${t.id},ts.value);close()">Update Status</button>`:""}<hr><h3>Comments</h3>${cs.map(c=>`<div class="comment"><b>${esc(c.author_name)}</b><p>${esc(c.text)}</p>${owner()||c.author_id==ME.id?`<button class="red" onclick="commentDel(${c.id},${t.id})">Delete</button>`:""}</div>`).join("")}<textarea id="ct" placeholder="Your comment"></textarea><button onclick="commentAdd(${t.id})">Add Comment</button><button class="gray" onclick="close()">Close</button>`;$("modal").classList.add("show")}
async function commentAdd(id){if(!ct.value.trim())return;await api("/api/tasks/"+id+"/comments",{method:"POST",body:JSON.stringify({text:ct.value})});close();load()}
async function commentDel(id,tid){if(confirm("Delete your comment?")){await del("comments",id);task(tid)}}
function close(){$("modal").classList.remove("show")}
function modal(type,mt){let b="";if(type==="user")b=`<h2>Add Developer</h2><label>Name</label><input id="a1"><label>Email</label><input id="a2"><label>Role</label><input id="a3" value="Data Engineer"><label>Password</label><input id="a4" type="password"><button onclick="addUser()">Create</button>`;
if(type==="epic")b=`<h2>Create Epic</h2><label>Name</label><input id="a1"><label>Description</label><textarea id="a2"></textarea><button onclick="addEpic()">Create</button>`;
if(type==="feature")b=`<h2>Create Feature</h2><label>Epic</label><select id="a1">${S.epics.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join("")}</select><label>Name</label><input id="a2"><button onclick="addFeature()">Create</button>`;
if(type==="pbi")b=`<h2>Create PBI</h2><label>Feature</label><select id="a1">${S.features.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join("")}</select><label>Title</label><input id="a2"><label>Priority</label><select id="a3"><option>High</option><option selected>Medium</option><option>Low</option></select><button onclick="addPbi()">Create</button>`;
if(type==="task")b=`<h2>Create Task</h2><label>PBI</label><select id="a1">${S.pbis.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join("")}</select><label>Title</label><input id="a2"><label>Assign To</label><select id="a3">${S.users.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select><label>Sprint</label><select id="a4"><option value="">Backlog</option>${S.sprints.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select><label>Priority</label><select id="a5"><option>High</option><option selected>Medium</option><option>Low</option></select><label>Description</label><textarea id="a6"></textarea><label>Acceptance Criteria</label><textarea id="a7"></textarea><button onclick="addTask()">Create</button>`;
if(type==="sprint")b=`<h2>Create Sprint</h2><label>Name</label><input id="a1"><label>Start</label><input id="a2" type="date"><label>End</label><input id="a3" type="date"><label>Goal</label><textarea id="a4"></textarea><label>State</label><select id="a5"><option>Future</option><option>Active</option><option>Closed</option></select><button onclick="addSprint()">Create</button>`;
if(type==="meeting")b=`<h2>Schedule Meeting</h2><label>Type</label><select id="a1">${["Daily Scrum","Sprint Planning","Sprint Review","Retrospective","Ad-hoc"].map(x=>`<option ${x===mt?"selected":""}>${x}</option>`).join("")}</select><label>Title</label><input id="a2" value="${esc(mt||"Team Meeting")}"><label>Date</label><input id="a3" type="date"><label>Time</label><input id="a4" type="time" value="10:00"><label>Duration</label><input id="a5" type="number" value="15"><label>Attendee emails</label><input id="a6"><label>Teams/Meet link</label><input id="a7"><label>Agenda</label><textarea id="a8">Yesterday / Today / Blockers</textarea><button onclick="addMeeting()">Schedule</button>`;
$("sheet").innerHTML=b+`<br><button class="gray" onclick="close()">Cancel</button>`;$("modal").classList.add("show")}
async function addUser(){await send("/api/users",{name:a1.value,email:a2.value,role:a3.value,password:a4.value})}async function addEpic(){await send("/api/epics",{title:a1.value,description:a2.value})}async function addFeature(){await send("/api/features",{epic_id:a1.value,title:a2.value})}async function addPbi(){await send("/api/pbis",{feature_id:a1.value,title:a2.value,priority:a3.value})}async function addTask(){await send("/api/tasks",{pbi_id:a1.value,title:a2.value,assignee_id:a3.value,sprint_id:a4.value||null,priority:a5.value,description:a6.value,acceptance_criteria:a7.value})}async function addSprint(){await send("/api/sprints",{name:a1.value,start_date:a2.value,end_date:a3.value,goal:a4.value,state:a5.value})}async function addMeeting(){await send("/api/meetings",{type:a1.value,title:a2.value,meeting_date:a3.value,meeting_time:a4.value,duration:a5.value,attendees:a6.value,link:a7.value,agenda:a8.value})}
async function send(u,b){try{await api(u,{method:"POST",body:JSON.stringify(b)});close();load()}catch(e){alert(e.message)}}$("modal").addEventListener("click",e=>e.target.id==="modal"&&close());
api("/api/me").then(d=>{if(d.user){ME=d.user;$("login").style.display="none";$("app").style.display="block";load()}})
</script></body></html>
